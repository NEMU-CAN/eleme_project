spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/你的数据库名称
    username: 你的用户名
    password: 你的密码
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath*:com.iteleme.backend.mapper/*.xml
  configuration:
    # 开启下划线到驼峰命名的自动映射
    map-underscore-to-camel-case: true
